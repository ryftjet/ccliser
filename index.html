<script>
    const year = new Date().getFullYear();
    document.getElementById('year').textContent = year.toString()

    const songName = new URLSearchParams(window.location.search).get('name');
    const ccliID = new URLSearchParams(window.location.search).get('ccli');
    const applemusicID = new URLSearchParams(window.location.search).get('am');
    const spotifyID = new URLSearchParams(window.location.search).get('sp');
    const youtubeID = new URLSearchParams(window.location.search).get('yt');

    const card = document.getElementById("card")
    const notFound = document.getElementById("notFound")
    const name = document.getElementById("name")
    const ccliButton = document.getElementById("ccli")
    const applemusicButton = document.getElementById("am")
    const spotifyButton = document.getElementById("sp")
    const youtubeButton = document.getElementById("yt")

    if (songName == null || songName === "") {
        card.hidden = true
        notFound.hidden = false
    } else {
        name.innerText = songName
        if (ccliID == null || ccliID === "") {
            ccliButton.hidden = true
        } else {
            ccliButton.href = "https://songselect.ccli.com/songs/" + ccliID
        }
        if (applemusicID == null || applemusicID === "") {
            applemusicButton.hidden = true
        } else {
            applemusicButton.href = "https://music.apple.com/au/song/" + applemusicID
        }
        if (spotifyID == null || spotifyID === "") {
            spotifyButton.hidden = true
        } else {
            spotifyButton.href = "https://open.spotify.com/track/" + spotifyID
        }
        if (youtubeID == null || youtubeID === "") {
            youtubeButton.hidden = true
        } else {
            youtubeButton.href = "https://music.youtube.com/watch?v=" + youtubeID
        }
    }
</script>
